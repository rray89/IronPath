name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-and-build:
    name: Static & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Run formatting, lint, and production builds
        run: >-
          ./gradlew spotlessCheck :app:lintDebug :app:lintBenchmarkRelease
          assembleDebug assembleRelease
          :app:assembleBenchmarkRelease :app:assembleNonMinifiedRelease
          :benchmark:assembleBenchmarkRelease :benchmark:assembleNonMinifiedRelease

      - name: Verify checked-in and packaged release profiles
        shell: bash
        run: |
          profiles=(
            app/src/release/generated/baselineProfiles/baseline-prof.txt
            app/src/release/generated/baselineProfiles/startup-prof.txt
          )
          for profile in "${profiles[@]}"; do
            if [[ ! -s "$profile" ]]; then
              echo "Required release profile is missing or empty: $profile"
              exit 1
            fi
            if ! grep -q 'Lcom/example/ironpath/' "$profile"; then
              echo "Release profile does not contain IronPath classes: $profile"
              exit 1
            fi
            foreign_rule="$(grep -Ev '^(#|$|[HSP]*Lcom/example/ironpath/)' "$profile" | head -n 1 || true)"
            if [[ -n "$foreign_rule" ]]; then
              echo "Release profile contains a rule owned outside IronPath: $profile"
              echo "$foreign_rule"
              exit 1
            fi
            if grep -q 'Lcom/example/ironpath/benchmark/' "$profile"; then
              echo "Release profile contains benchmark-only seed code: $profile"
              exit 1
            fi
          done

          rewritten_profile="app/build/intermediates/combined_art_profile/release/compileReleaseArtProfile/baseline-prof.txt"
          if [[ ! -s "$rewritten_profile" ]]; then
            echo "R8-rewritten release profile is missing or empty: $rewritten_profile"
            exit 1
          fi
          if ! grep -q '^[HSP]*Lcom/example/ironpath/MainActivity;' "$rewritten_profile"; then
            echo "R8-rewritten release profile does not retain the IronPath startup entry point"
            exit 1
          fi
          if grep -q 'Lcom/example/ironpath/benchmark/' "$rewritten_profile"; then
            echo "R8-rewritten release profile contains benchmark-only seed code"
            exit 1
          fi

          apk="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          if [[ -z "$apk" ]]; then
            echo "Release APK was not found"
            exit 1
          fi
          profile_size="$(unzip -l "$apk" 'assets/dexopt/baseline.prof' | awk '$4 == "assets/dexopt/baseline.prof" { print $1 }')"
          if [[ -z "$profile_size" || "$profile_size" -le 0 ]]; then
            echo "Release APK is missing a non-empty assets/dexopt/baseline.prof"
            exit 1
          fi
          if [[ "$profile_size" -gt 1572864 ]]; then
            echo "Compiled Baseline Profile is ${profile_size} bytes; maximum is 1572864 bytes"
            exit 1
          fi
          metadata_size="$(unzip -l "$apk" 'assets/dexopt/baseline.profm' | awk '$4 == "assets/dexopt/baseline.profm" { print $1 }')"
          if [[ -z "$metadata_size" || "$metadata_size" -le 0 ]]; then
            echo "Release APK is missing non-empty assets/dexopt/baseline.profm metadata"
            exit 1
          fi
          echo "Verified ${apk}: profile=${profile_size} bytes, metadata=${metadata_size} bytes"

      - name: Verify benchmark seed activity isolation
        shell: bash
        run: |
          release_manifests=(
            app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml
            app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
          )
          for manifest in "${release_manifests[@]}"; do
            if [[ ! -s "$manifest" ]]; then
              echo "Expected merged manifest is missing: $manifest"
              exit 1
            fi
            if grep -q 'com.example.ironpath.benchmark.BenchmarkSeedActivity' "$manifest"; then
              echo "BenchmarkSeedActivity leaked into a production manifest: $manifest"
              exit 1
            fi
            if grep -q '<profileable' "$manifest" || grep -q 'android:shell="true"' "$manifest"; then
              echo "Profileable shell access leaked into a production manifest: $manifest"
              exit 1
            fi
          done

          synthetic_manifests=(
            app/build/intermediates/merged_manifests/benchmarkRelease/processBenchmarkReleaseManifest/AndroidManifest.xml
            app/build/intermediates/merged_manifests/nonMinifiedRelease/processNonMinifiedReleaseManifest/AndroidManifest.xml
          )
          for manifest in "${synthetic_manifests[@]}"; do
            if [[ ! -s "$manifest" ]]; then
              echo "Expected synthetic merged manifest is missing: $manifest"
              exit 1
            fi
            if ! grep -q 'com.example.ironpath.benchmark.BenchmarkSeedActivity' "$manifest"; then
              echo "BenchmarkSeedActivity is missing from its synthetic test manifest: $manifest"
              exit 1
            fi
            if ! grep -q '<profileable' "$manifest" || ! grep -q 'android:shell="true"' "$manifest"; then
              echo "Synthetic test manifest is missing profileable shell access: $manifest"
              exit 1
            fi
          done

          synthetic_apks=(
            app/build/outputs/apk/benchmarkRelease/app-benchmarkRelease.apk
            app/build/outputs/apk/nonMinifiedRelease/app-nonMinifiedRelease.apk
          )
          for apk in "${synthetic_apks[@]}"; do
            if [[ ! -s "$apk" ]]; then
              echo "Expected synthetic APK is missing: $apk"
              exit 1
            fi
            seed_class_count="$(
              unzip -p "$apk" 'classes*.dex' |
                strings |
                grep -F -c 'Lcom/example/ironpath/benchmark/BenchmarkSeedActivity;' || true
            )"
            if [[ "$seed_class_count" -lt 1 ]]; then
              echo "BenchmarkSeedActivity is missing from the synthetic APK dex: $apk"
              exit 1
            fi
          done

      - name: Upload lint reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
            app/build/reports/lint-results-benchmarkRelease.html
            app/build/reports/lint-results-benchmarkRelease.xml
            app/build/reports/lint-results-benchmarkRelease.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload release obfuscation mappings
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-obfuscation-mappings
          path: |
            app/build/outputs/mapping/release/
            app/build/outputs/mapping/benchmarkRelease/
          if-no-files-found: error
          retention-days: 14

  unit-and-coverage:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Test coverage report renderer
        run: node --test .github/scripts/coverage-report.test.mjs

      - name: Run unit tests with JaCoCo coverage
        # createDebugUnitTestCoverageReport depends on testDebugUnitTest and generates
        # HTML + XML reports at app/build/reports/coverage/test/debug/
        run: >-
          ./gradlew testDebugUnitTest createDebugUnitTestCoverageReport verifyCoreCoverage
          -PenableCoverage

      - name: Upload JVM unit coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-unit-coverage-report
          path: app/build/reports/coverage/test/debug/
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit-test XML and HTML results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  firebase-rules:
    name: Firebase Rules
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      - name: Install pinned Firebase emulator tools
        run: npm ci --ignore-scripts --prefix firebase

      - name: Run Firestore Security Rules tests
        run: ./gradlew firebaseRulesTest

  api29-hilt-smoke:
    name: API 29 Hilt Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run API 29 production instrumentation with coverage
        run: >-
          ./gradlew :app:createPixel2Api29DebugAndroidTestCoverageReport
          -PenableAndroidTestCoverage
          -Pandroid.testInstrumentationRunnerArguments.notClass=com.example.ironpath.accessibility.PlatformAccessibilityChecksTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload API 29 instrumented coverage report
        uses: actions/upload-artifact@v4
        with:
          name: api29-instrumented-coverage-report
          path: app/build/reports/coverage/androidTest/debug/pixel2Api29/
          if-no-files-found: error
          retention-days: 14

      - name: Upload API 29 HTML reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api29-hilt-smoke-report
          path: app/build/reports/androidTests/managedDevice/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload API 29 XML results, logcat, and additional outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api29-hilt-smoke-results
          path: |
            app/build/outputs/androidTest-results/managedDevice/
            app/build/outputs/managed_device_android_test_additional_output/
          if-no-files-found: warn
          retention-days: 14

  coverage-summary:
    name: Coverage Summary
    needs: [unit-and-coverage, api29-hilt-smoke]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Download JVM unit coverage
        uses: actions/download-artifact@v4
        with:
          name: jvm-unit-coverage-report
          path: coverage/unit

      - name: Download API 29 instrumented coverage
        uses: actions/download-artifact@v4
        with:
          name: api29-instrumented-coverage-report
          path: coverage/android

      - name: Post layer-aware coverage summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { pathToFileURL } = require('url');
            const modulePath = path.join(
              process.env.GITHUB_WORKSPACE,
              '.github/scripts/coverage-report.mjs',
            );
            const { buildCoverageComment } = await import(
              pathToFileURL(modulePath).href
            );
            const body = buildCoverageComment({
              unitXml: fs.readFileSync('coverage/unit/report.xml', 'utf8'),
              androidXml: fs.readFileSync('coverage/android/report.xml', 'utf8'),
            });
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' &&
              comment.body.includes('## Coverage Report'),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  sonar-analysis:
    name: SonarQube Analysis
    needs: [static-and-build, unit-and-coverage, firebase-rules, api29-hilt-smoke]
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Download Android lint reports
        uses: actions/download-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports

      - name: Download JVM unit coverage
        uses: actions/download-artifact@v4
        with:
          name: jvm-unit-coverage-report
          path: coverage/unit

      - name: Download API 29 instrumented coverage
        uses: actions/download-artifact@v4
        with:
          name: api29-instrumented-coverage-report
          path: coverage/android

      - name: Verify Sonar configuration
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          required=(SONAR_TOKEN SONAR_PROJECT_KEY SONAR_ORGANIZATION SONAR_HOST_URL)
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Required Sonar configuration is missing: ${name}"
              exit 1
            fi
          done
          test -s app/build/reports/lint-results-debug.xml
          test -s coverage/unit/report.xml
          test -s coverage/android/report.xml

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: >-
          ./gradlew :app:assembleDebug sonar
          -Dsonar.projectKey="$SONAR_PROJECT_KEY"
          -Dsonar.organization="$SONAR_ORGANIZATION"
          -Dsonar.coverage.jacoco.xmlReportPaths="$GITHUB_WORKSPACE/coverage/unit/report.xml,$GITHUB_WORKSPACE/coverage/android/report.xml"
