name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-and-build:
    name: Static & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Run formatting, lint, and production builds
        run: >-
          ./gradlew spotlessCheck :app:lintDebug :app:lintBenchmarkRelease
          assembleDebug assembleRelease
          :app:assembleBenchmarkRelease :app:assembleNonMinifiedRelease
          :benchmark:assembleBenchmarkRelease :benchmark:assembleNonMinifiedRelease

      - name: Verify checked-in and packaged release profiles
        shell: bash
        run: |
          profiles=(
            app/src/release/generated/baselineProfiles/baseline-prof.txt
            app/src/release/generated/baselineProfiles/startup-prof.txt
          )
          for profile in "${profiles[@]}"; do
            if [[ ! -s "$profile" ]]; then
              echo "Required release profile is missing or empty: $profile"
              exit 1
            fi
            if ! grep -q 'Lcom/example/ironpath/' "$profile"; then
              echo "Release profile does not contain IronPath classes: $profile"
              exit 1
            fi
            foreign_rule="$(grep -Ev '^(#|$|[HSP]*Lcom/example/ironpath/)' "$profile" | head -n 1 || true)"
            if [[ -n "$foreign_rule" ]]; then
              echo "Release profile contains a rule owned outside IronPath: $profile"
              echo "$foreign_rule"
              exit 1
            fi
            if grep -q 'Lcom/example/ironpath/benchmark/' "$profile"; then
              echo "Release profile contains benchmark-only seed code: $profile"
              exit 1
            fi
          done

          rewritten_profile="app/build/intermediates/combined_art_profile/release/compileReleaseArtProfile/baseline-prof.txt"
          if [[ ! -s "$rewritten_profile" ]]; then
            echo "R8-rewritten release profile is missing or empty: $rewritten_profile"
            exit 1
          fi
          if ! grep -q '^[HSP]*Lcom/example/ironpath/MainActivity;' "$rewritten_profile"; then
            echo "R8-rewritten release profile does not retain the IronPath startup entry point"
            exit 1
          fi
          if grep -q 'Lcom/example/ironpath/benchmark/' "$rewritten_profile"; then
            echo "R8-rewritten release profile contains benchmark-only seed code"
            exit 1
          fi

          apk="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          if [[ -z "$apk" ]]; then
            echo "Release APK was not found"
            exit 1
          fi
          profile_size="$(unzip -l "$apk" 'assets/dexopt/baseline.prof' | awk '$4 == "assets/dexopt/baseline.prof" { print $1 }')"
          if [[ -z "$profile_size" || "$profile_size" -le 0 ]]; then
            echo "Release APK is missing a non-empty assets/dexopt/baseline.prof"
            exit 1
          fi
          if [[ "$profile_size" -gt 1572864 ]]; then
            echo "Compiled Baseline Profile is ${profile_size} bytes; maximum is 1572864 bytes"
            exit 1
          fi
          metadata_size="$(unzip -l "$apk" 'assets/dexopt/baseline.profm' | awk '$4 == "assets/dexopt/baseline.profm" { print $1 }')"
          if [[ -z "$metadata_size" || "$metadata_size" -le 0 ]]; then
            echo "Release APK is missing non-empty assets/dexopt/baseline.profm metadata"
            exit 1
          fi
          echo "Verified ${apk}: profile=${profile_size} bytes, metadata=${metadata_size} bytes"

      - name: Verify benchmark seed activity isolation
        shell: bash
        run: |
          release_manifests=(
            app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml
            app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
          )
          for manifest in "${release_manifests[@]}"; do
            if [[ ! -s "$manifest" ]]; then
              echo "Expected merged manifest is missing: $manifest"
              exit 1
            fi
            if grep -q 'com.example.ironpath.benchmark.BenchmarkSeedActivity' "$manifest"; then
              echo "BenchmarkSeedActivity leaked into a production manifest: $manifest"
              exit 1
            fi
            if grep -q '<profileable' "$manifest" || grep -q 'android:shell="true"' "$manifest"; then
              echo "Profileable shell access leaked into a production manifest: $manifest"
              exit 1
            fi
          done

          synthetic_manifests=(
            app/build/intermediates/merged_manifests/benchmarkRelease/processBenchmarkReleaseManifest/AndroidManifest.xml
            app/build/intermediates/merged_manifests/nonMinifiedRelease/processNonMinifiedReleaseManifest/AndroidManifest.xml
          )
          for manifest in "${synthetic_manifests[@]}"; do
            if [[ ! -s "$manifest" ]]; then
              echo "Expected synthetic merged manifest is missing: $manifest"
              exit 1
            fi
            if ! grep -q 'com.example.ironpath.benchmark.BenchmarkSeedActivity' "$manifest"; then
              echo "BenchmarkSeedActivity is missing from its synthetic test manifest: $manifest"
              exit 1
            fi
            if ! grep -q '<profileable' "$manifest" || ! grep -q 'android:shell="true"' "$manifest"; then
              echo "Synthetic test manifest is missing profileable shell access: $manifest"
              exit 1
            fi
          done

      - name: Upload lint reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
            app/build/reports/lint-results-benchmarkRelease.html
            app/build/reports/lint-results-benchmarkRelease.xml
            app/build/reports/lint-results-benchmarkRelease.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload release obfuscation mappings
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-obfuscation-mappings
          path: |
            app/build/outputs/mapping/release/
            app/build/outputs/mapping/benchmarkRelease/
          if-no-files-found: error
          retention-days: 14

  unit-and-coverage:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # required to post coverage comment on PRs

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Run unit tests with JaCoCo coverage
        # createDebugUnitTestCoverageReport depends on testDebugUnitTest and generates
        # HTML + XML reports at app/build/reports/coverage/test/debug/
        run: >-
          ./gradlew testDebugUnitTest createDebugUnitTestCoverageReport verifyCoreCoverage
          -PenableCoverage

      - name: Upload JaCoCo XML and HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: app/build/reports/coverage/test/debug/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unit-test XML and HTML results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Post coverage summary
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // AGP JaCoCo XML report path
            const xmlPath = 'app/build/reports/coverage/test/debug/report.xml';
            if (!fs.existsSync(xmlPath)) {
              console.log('Coverage XML not found at ' + xmlPath + ', skipping comment');
              return;
            }
            const xml = fs.readFileSync(xmlPath, 'utf8');
            const parseCounter = (block, type) => {
              const matches = [...block.matchAll(new RegExp(`<counter type="${type}" missed="(\\d+)" covered="(\\d+)"\\/>`, 'g'))];
              const match = matches[matches.length - 1];
              if (!match) return null;
              const missed = parseInt(match[1], 10);
              const covered = parseInt(match[2], 10);
              const total = missed + covered;
              const pct = total > 0 ? Math.round((covered / total) * 100) : 0;
              return { missed, covered, total, pct };
            };

            const rootCounters = {
              instruction: parseCounter(xml, 'INSTRUCTION'),
              branch: parseCounter(xml, 'BRANCH'),
              line: parseCounter(xml, 'LINE'),
              method: parseCounter(xml, 'METHOD'),
              class: parseCounter(xml, 'CLASS'),
            };

            if (!rootCounters.line) {
              console.log('No LINE counter in JaCoCo report, skipping');
              return;
            }

            const packageRows = [];
            const packageMatches = [...xml.matchAll(/<package name="([^"]+)">([\s\S]*?)<\/package>/g)];
            for (const [, pkgName, pkgBlock] of packageMatches) {
              const line = parseCounter(pkgBlock, 'LINE');
              if (!line || line.total === 0) continue;
              packageRows.push({
                name: pkgName.replaceAll('/', '.'),
                ...line,
              });
            }

            const fileRows = [];
            const coreTotals = {
              line: { covered: 0, missed: 0 },
              branch: { covered: 0, missed: 0 },
            };
            for (const [, pkgName, pkgBlock] of packageMatches) {
              const sourceMatches = [...pkgBlock.matchAll(/<sourcefile name="([^"]+)">([\s\S]*?)<\/sourcefile>/g)];
              for (const [, fileName, fileBlock] of sourceMatches) {
                const line = parseCounter(fileBlock, 'LINE');
                if (!line || line.total === 0) continue;
                const path = `${pkgName}/${fileName}`;
                fileRows.push({
                  name: path,
                  ...line,
                });
                const isCore = path.endsWith('.kt') &&
                  (path.startsWith('com/example/ironpath/domain/') ||
                    path.startsWith('com/example/ironpath/data/repository/') ||
                    (path.startsWith('com/example/ironpath/ui/screens/') &&
                      path.endsWith('ViewModel.kt') &&
                      !path.endsWith('DevToolsViewModel.kt')));
                if (isCore) {
                  coreTotals.line.covered += line.covered;
                  coreTotals.line.missed += line.missed;
                  const branch = parseCounter(fileBlock, 'BRANCH');
                  if (branch) {
                    coreTotals.branch.covered += branch.covered;
                    coreTotals.branch.missed += branch.missed;
                  }
                }
              }
            }

            const summarizeCore = ({ covered, missed }) => {
              const total = covered + missed;
              const pct = total > 0 ? (covered / total) * 100 : 0;
              return { covered, total, pct };
            };
            const coreCounters = {
              line: summarizeCore(coreTotals.line),
              branch: summarizeCore(coreTotals.branch),
            };

            packageRows.sort((a, b) => {
              if (a.pct !== b.pct) return a.pct - b.pct;
              return b.missed - a.missed;
            });

            fileRows.sort((a, b) => {
              if (a.pct !== b.pct) return a.pct - b.pct;
              return b.missed - a.missed;
            });

            const topPackages = packageRows.slice(0, 10);
            const topFiles = fileRows.slice(0, 20);

            let body = '## Coverage Report\n\n';
            body += '### Core merge gate\n\n';
            body += 'Scope: domain, repositories, and non-dev ViewModels.\n\n';
            body += '| Metric | Covered | Total | % | Minimum |\n';
            body += '|--------|---------|-------|---|---------|\n';
            body += `| Lines | ${coreCounters.line.covered} | ${coreCounters.line.total} | **${coreCounters.line.pct.toFixed(2)}%** | 85% |\n`;
            body += `| Branches | ${coreCounters.branch.covered} | ${coreCounters.branch.total} | **${coreCounters.branch.pct.toFixed(2)}%** | 70% |\n`;
            body += '\n### Overall project coverage\n\n';
            body += '| Metric | Covered | Total | % |\n';
            body += '|--------|---------|-------|---|\n';
            for (const [label, counter] of Object.entries({
              Instructions: rootCounters.instruction,
              Branches: rootCounters.branch,
              Lines: rootCounters.line,
              Methods: rootCounters.method,
              Classes: rootCounters.class,
            })) {
              if (!counter) continue;
              body += `| ${label} | ${counter.covered} | ${counter.total} | **${counter.pct}%** |\n`;
            }

            if (topPackages.length) {
              body += '\n### Lowest-Coverage Packages\n\n';
              body += '| Package | Covered | Total | % |\n';
              body += '|---------|---------|-------|---|\n';
              for (const row of topPackages) {
                body += `| \`${row.name}\` | ${row.covered} | ${row.total} | ${row.pct}% |\n`;
              }
            }

            if (topFiles.length) {
              body += '\n### Lowest-Coverage Files\n\n';
              body += '| File | Covered | Total | % |\n';
              body += '|------|---------|-------|---|\n';
              for (const row of topFiles) {
                body += `| \`${row.name}\` | ${row.covered} | ${row.total} | ${row.pct}% |\n`;
              }
            }

            if (fileRows.length > topFiles.length) {
              body += `\n<sub>Showing ${topFiles.length} of ${fileRows.length} files. Use the \`jacoco-coverage-report\` artifact for the full HTML report.</sub>\n`;
            } else {
              body += '\n<sub>Full HTML coverage report is attached as the `jacoco-coverage-report` artifact.</sub>\n';
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existingComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('## Coverage Report')
            );
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  api29-hilt-smoke:
    name: API 29 Hilt Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run API 29 production instrumentation suite
        run: >-
          ./gradlew pixel2Api29DebugAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.notClass=com.example.ironpath.accessibility.PlatformAccessibilityChecksTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload API 29 HTML reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api29-hilt-smoke-report
          path: app/build/reports/androidTests/managedDevice/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload API 29 XML results, logcat, and additional outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api29-hilt-smoke-results
          path: |
            app/build/outputs/androidTest-results/managedDevice/
            app/build/outputs/managed_device_android_test_additional_output/
          if-no-files-found: warn
          retention-days: 14
