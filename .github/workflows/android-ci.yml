name: Android CI

on:
  push:
    branches: [main, "feature/**", "bugfix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # required to post coverage comment on PRs

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Check Spotless formatting
        run: ./gradlew spotlessCheck

      - name: Run unit tests with JaCoCo coverage
        # createDebugUnitTestCoverageReport depends on testDebugUnitTest and generates
        # HTML + XML reports at app/build/reports/coverage/test/debug/
        run: ./gradlew createDebugUnitTestCoverageReport

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: app/build/reports/coverage/test/debug/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Post coverage summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // AGP JaCoCo XML report path
            const xmlPath = 'app/build/reports/coverage/test/debug/report.xml';
            if (!fs.existsSync(xmlPath)) {
              console.log('Coverage XML not found at ' + xmlPath + ', skipping comment');
              return;
            }
            const xml = fs.readFileSync(xmlPath, 'utf8');
            // JaCoCo format: <counter type="LINE" missed="X" covered="Y"/>
            // The last occurrence is the project-level total
            const lineMatches = [...xml.matchAll(/<counter type="LINE" missed="(\d+)" covered="(\d+)"\/>/g)];
            const branchMatches = [...xml.matchAll(/<counter type="BRANCH" missed="(\d+)" covered="(\d+)"\/>/g)];
            if (!lineMatches.length) {
              console.log('No LINE counter in JaCoCo report, skipping');
              return;
            }
            const lastLine = lineMatches[lineMatches.length - 1];
            const lineMissed = parseInt(lastLine[1]);
            const lineCovered = parseInt(lastLine[2]);
            const lineTotal = lineMissed + lineCovered;
            const linePct = lineTotal > 0 ? Math.round((lineCovered / lineTotal) * 100) : 0;
            let body = `## Coverage Report\n\n| Metric | Covered | Total | % |\n|--------|---------|-------|---|\n`;
            body += `| Lines | ${lineCovered} | ${lineTotal} | **${linePct}%** |\n`;
            if (branchMatches.length) {
              const lastBranch = branchMatches[branchMatches.length - 1];
              const branchMissed = parseInt(lastBranch[1]);
              const branchCovered = parseInt(lastBranch[2]);
              const branchTotal = branchMissed + branchCovered;
              const branchPct = branchTotal > 0 ? Math.round((branchCovered / branchTotal) * 100) : 0;
              body += `| Branches | ${branchCovered} | ${branchTotal} | **${branchPct}%** |\n`;
            }
            body += `\n> Full report available as the \`jacoco-coverage-report\` artifact on this run.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existingComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('## Coverage Report')
            );
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
