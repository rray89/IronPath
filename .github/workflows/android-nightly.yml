name: Android Nightly

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: android-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compatibility-matrix:
    name: API 29 & 36 Compatibility Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Run the managed devices serially. On a clean hosted runner, parallel setup races while
      # both devices install the shared Android Emulator package into the same SDK directory.
      - name: Run API 29 production compatibility
        run: >-
          ./gradlew :app:pixel2Api29DebugAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.notClass=com.example.ironpath.accessibility.PlatformAccessibilityChecksTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Run API 36 production compatibility
        if: success() || failure()
        run: >-
          ./gradlew :app:pixel8Api36DebugAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.notClass=com.example.ironpath.accessibility.PlatformAccessibilityChecksTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload compatibility reports, results, and logcat
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-compatibility-matrix
          path: |
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/androidTest-results/managedDevice/
            app/build/outputs/managed_device_android_test_additional_output/
          if-no-files-found: warn
          retention-days: 30

  api36-accessibility:
    name: API 36 Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run API 36 accessibility and adaptive-layout suite
        run: >-
          ./gradlew :app:pixel8Api36DebugAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.package=com.example.ironpath.accessibility
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload accessibility reports, results, and logcat
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-api36-accessibility
          path: |
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/androidTest-results/managedDevice/
            app/build/outputs/managed_device_android_test_additional_output/
          if-no-files-found: warn
          retention-days: 30

  journey-stability:
    name: Journey State-Leak Detection
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run critical journeys - pass 1
        id: journey_pass_1
        continue-on-error: true
        run: >-
          ./gradlew :app:pixel8Api36DebugAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.package=com.example.ironpath.e2e
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Preserve pass 1 results
        if: always()
        run: |
          mkdir -p nightly-artifacts/journey-run-1
          if [[ -d app/build/reports/androidTests/managedDevice ]]; then
            cp -R app/build/reports/androidTests/managedDevice nightly-artifacts/journey-run-1/reports
          fi
          if [[ -d app/build/outputs/androidTest-results/managedDevice ]]; then
            cp -R app/build/outputs/androidTest-results/managedDevice nightly-artifacts/journey-run-1/results
          fi
          if [[ -d app/build/outputs/managed_device_android_test_additional_output ]]; then
            cp -R app/build/outputs/managed_device_android_test_additional_output nightly-artifacts/journey-run-1/additional-outputs
          fi

      - name: Run critical journeys - pass 2
        id: journey_pass_2
        if: always()
        continue-on-error: true
        run: >-
          ./gradlew :app:pixel8Api36DebugAndroidTest --rerun-tasks
          -Pandroid.testInstrumentationRunnerArguments.package=com.example.ironpath.e2e
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Preserve pass 2 results
        if: always()
        run: |
          mkdir -p nightly-artifacts/journey-run-2
          if [[ -d app/build/reports/androidTests/managedDevice ]]; then
            cp -R app/build/reports/androidTests/managedDevice nightly-artifacts/journey-run-2/reports
          fi
          if [[ -d app/build/outputs/androidTest-results/managedDevice ]]; then
            cp -R app/build/outputs/androidTest-results/managedDevice nightly-artifacts/journey-run-2/results
          fi
          if [[ -d app/build/outputs/managed_device_android_test_additional_output ]]; then
            cp -R app/build/outputs/managed_device_android_test_additional_output nightly-artifacts/journey-run-2/additional-outputs
          fi

      - name: Run critical journeys - pass 3
        id: journey_pass_3
        if: always()
        continue-on-error: true
        run: >-
          ./gradlew :app:pixel8Api36DebugAndroidTest --rerun-tasks
          -Pandroid.testInstrumentationRunnerArguments.package=com.example.ironpath.e2e
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Preserve pass 3 results
        if: always()
        run: |
          mkdir -p nightly-artifacts/journey-run-3
          if [[ -d app/build/reports/androidTests/managedDevice ]]; then
            cp -R app/build/reports/androidTests/managedDevice nightly-artifacts/journey-run-3/reports
          fi
          if [[ -d app/build/outputs/androidTest-results/managedDevice ]]; then
            cp -R app/build/outputs/androidTest-results/managedDevice nightly-artifacts/journey-run-3/results
          fi
          if [[ -d app/build/outputs/managed_device_android_test_additional_output ]]; then
            cp -R app/build/outputs/managed_device_android_test_additional_output nightly-artifacts/journey-run-3/additional-outputs
          fi

      - name: Upload all journey passes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-journey-stability
          path: |
            nightly-artifacts/
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/androidTest-results/managedDevice/
            app/build/outputs/managed_device_android_test_additional_output/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce all journey passes
        if: always()
        env:
          PASS_1: ${{ steps.journey_pass_1.outcome }}
          PASS_2: ${{ steps.journey_pass_2.outcome }}
          PASS_3: ${{ steps.journey_pass_3.outcome }}
        run: |
          if [[ "$PASS_1" != "success" || "$PASS_2" != "success" || "$PASS_3" != "success" ]]; then
            echo "Journey outcomes: pass1=$PASS_1 pass2=$PASS_2 pass3=$PASS_3"
            exit 1
          fi

  baseline-and-benchmarks:
    name: Release Baseline Profile & Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Remove checked-in profiles to prove fresh generation
        run: >-
          rm -f
          app/src/release/generated/baselineProfiles/baseline-prof.txt
          app/src/release/generated/baselineProfiles/startup-prof.txt

      - name: Generate the release Baseline Profile
        run: >-
          ./gradlew :app:generateReleaseBaselineProfile
          -Pandroid.testInstrumentationRunnerArguments.class=com.example.ironpath.benchmark.BaselineProfileGenerator
          -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Verify generated Baseline Profile
        shell: bash
        run: |
          profiles=(
            app/src/release/generated/baselineProfiles/baseline-prof.txt
            app/src/release/generated/baselineProfiles/startup-prof.txt
          )
          for profile in "${profiles[@]}"; do
            if [[ ! -s "$profile" ]]; then
              echo "Required generated profile is missing or empty: $profile"
              exit 1
            fi
            if ! grep -q 'Lcom/example/ironpath/' "$profile"; then
              echo "Generated profile does not contain IronPath classes: $profile"
              exit 1
            fi
            foreign_rule="$(grep -Ev '^(#|$|[HSP]*Lcom/example/ironpath/)' "$profile" | head -n 1 || true)"
            if [[ -n "$foreign_rule" ]]; then
              echo "Generated profile contains a rule owned outside IronPath: $profile"
              echo "$foreign_rule"
              exit 1
            fi
            if grep -q 'Lcom/example/ironpath/benchmark/' "$profile"; then
              echo "Generated profile contains benchmark-only seed code: $profile"
              exit 1
            fi
            echo "Verified generated profile: $profile"
          done

      - name: Assemble release with the generated profile
        run: ./gradlew :app:assembleRelease

      - name: Verify compiled profile in release APK
        shell: bash
        run: |
          rewritten_profile="app/build/intermediates/combined_art_profile/release/compileReleaseArtProfile/baseline-prof.txt"
          if [[ ! -s "$rewritten_profile" ]]; then
            echo "R8-rewritten release profile is missing or empty: $rewritten_profile"
            exit 1
          fi
          if ! grep -q '^[HSP]*Lcom/example/ironpath/MainActivity;' "$rewritten_profile"; then
            echo "R8-rewritten release profile does not retain the IronPath startup entry point"
            exit 1
          fi
          if grep -q 'Lcom/example/ironpath/benchmark/' "$rewritten_profile"; then
            echo "R8-rewritten release profile contains benchmark-only seed code"
            exit 1
          fi
          apk="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          if [[ -z "$apk" ]]; then
            echo "Release APK was not found"
            exit 1
          fi
          profile_size="$(unzip -l "$apk" 'assets/dexopt/baseline.prof' | awk '$4 == "assets/dexopt/baseline.prof" { print $1 }')"
          if [[ -z "$profile_size" || "$profile_size" -le 0 ]]; then
            echo "Release APK is missing a non-empty assets/dexopt/baseline.prof"
            exit 1
          fi
          if [[ "$profile_size" -gt 1572864 ]]; then
            echo "Compiled Baseline Profile is ${profile_size} bytes; maximum is 1572864 bytes"
            exit 1
          fi
          metadata_size="$(unzip -l "$apk" 'assets/dexopt/baseline.profm' | awk '$4 == "assets/dexopt/baseline.profm" { print $1 }')"
          if [[ -z "$metadata_size" || "$metadata_size" -le 0 ]]; then
            echo "Release APK is missing non-empty assets/dexopt/baseline.profm metadata"
            exit 1
          fi
          echo "Verified ${apk}: profile=${profile_size} bytes, metadata=${metadata_size} bytes"

      - name: Run informational API 36 emulator benchmarks
        # Timing numbers are trend artifacts. Task failures, missing profiles, crashes, and ANRs block.
        run: >-
          ./gradlew :benchmark:pixel8Api36BenchmarkReleaseAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.class=com.example.ironpath.benchmark.StartupBenchmark,com.example.ironpath.benchmark.CriticalFlowBenchmark
          -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload Baseline Profile, release APK, benchmark reports, and traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-release-performance
          path: |
            app/src/**/generated/baselineProfiles/
            app/build/outputs/apk/release/
            app/build/outputs/mapping/release/
            app/build/outputs/mapping/benchmarkRelease/
            benchmark/build/reports/androidTests/managedDevice/
            benchmark/build/outputs/androidTest-results/managedDevice/
            benchmark/build/outputs/managed_device_android_test_additional_output/
          if-no-files-found: warn
          retention-days: 30
